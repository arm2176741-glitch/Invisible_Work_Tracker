spring.application.name=InvisibleWorkTracker

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/invisible_work_tracker_dev}
spring.datasource.username=${DB_USERNAME:iwt_user}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
fieldproof.uploads.work-entry-photos-dir=${WORK_ENTRY_PHOTO_UPLOAD_DIR:uploads/work-entry-photos}
