<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FieldProof Mobile Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: start center;
        gap: 18px;
        padding: 24px;
        background: #070b11;
        color: #f8fafc;
      }

      header {
        width: min(100%, 980px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        line-height: 1.2;
      }

      p {
        color: rgba(248, 250, 252, 0.58);
        font-size: 13px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      button {
        min-height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(248, 250, 252, 0.88);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 750;
        padding: 0 12px;
      }

      button[data-active="true"] {
        border-color: rgba(245, 196, 0, 0.5);
        background: rgba(245, 196, 0, 0.14);
        color: #ffd84a;
      }

      .device-shell {
        width: var(--device-width, 390px);
        height: var(--device-height, 844px);
        max-width: calc(100vw - 32px);
        overflow: hidden;
        border: 10px solid #111923;
        border-radius: 38px;
        background: #05080d;
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.45),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        background: #05080d;
      }

      @media (max-width: 760px) {
        body {
          padding: 12px;
        }

        header {
          display: grid;
        }

        .controls {
          justify-content: start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>FieldProof Mobile Preview</h1>
        <p>Use this on your laptop when browser device mode is being unreliable.</p>
      </div>
      <div class="controls" aria-label="Preview size">
        <button type="button" data-width="390" data-height="844" data-active="true">
          iPhone 12
        </button>
        <button type="button" data-width="375" data-height="812">
          iPhone X
        </button>
        <button type="button" data-width="430" data-height="932">
          Large phone
        </button>
        <button type="button" id="reload-preview">
          Reload
        </button>
      </div>
    </header>

    <main class="device-shell" id="device-shell">
      <iframe src="/" title="FieldProof app mobile preview"></iframe>
    </main>

    <script>
      const shell = document.getElementById("device-shell")
      const reloadButton = document.getElementById("reload-preview")
      const iframe = document.querySelector("iframe")
      const sizeButtons = Array.from(document.querySelectorAll("[data-width]"))

      sizeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          shell.style.setProperty("--device-width", `${button.dataset.width}px`)
          shell.style.setProperty("--device-height", `${button.dataset.height}px`)

          sizeButtons.forEach((item) => {
            item.dataset.active = String(item === button)
          })
        })
      })

      reloadButton.addEventListener("click", () => {
        iframe.contentWindow.location.reload()
      })
    </script>
  </body>
</html>
