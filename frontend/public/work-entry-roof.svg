<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Roof work evidence">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f9ab5"/>
      <stop offset="0.48" stop-color="#d58a52"/>
      <stop offset="1" stop-color="#221823"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c4a45"/>
      <stop offset="1" stop-color="#14191e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.85" numOctaves="2" seed="12" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
